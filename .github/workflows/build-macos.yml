name: Build macOS installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Check syntax
        run: |
          python -m py_compile yaca_spectra.py translations.py

      - name: Build macOS app
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "YACA-Spectra-HPLC" \
            --add-data "assets:assets" \
            --hidden-import=PIL._tkinter_finder \
            --collect-submodules=PIL \
            --collect-all matplotlib \
            yaca_spectra.py

      - name: Create DMG installer
        run: |
          mkdir -p dist/dmg
          cp -R dist/YACA-Spectra-HPLC.app dist/dmg/
          hdiutil create \
            -volname "YACA-Spectra-HPLC" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            dist/YACA-Spectra-HPLC-macOS.dmg

      - name: Upload macOS installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: YACA-Spectra-HPLC-macOS
          path: dist/YACA-Spectra-HPLC-macOS.dmg

      - name: Upload DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YACA-Spectra-HPLC-macOS.dmg
